[prep]
filters = ['F555W', 'F814W', 'F090W', 'F150W', 'F160W', 'F277W']
PSF_file = 'PSFdata.h5'
blur_psf = {}                          # empty: calibrator bootstrap picks per-filter blur
custom_initial_crop = 1
sigma_guess = 10
auto_crop = true
auto_crop_factor = 8                   # cutout half-axis in σ of best-fit Gaussian

[core]
base_filter = 'F150W'
iter_basefit = 10
iter_scalefit = 3
fit_complex_model = false              # true = disk+bulge (2 Sersic components) instead of one
sersic_psf_crop_flux_fraction = 0.98   # crop the PSF used for the SERSIC convolution to the smallest centred square holding this much flux (that FFT runs ~1e4x per base fit and its cost is set by the PSF size). Does NOT affect the PSF used for point-source photometry. 1.0 disables.
allow_refit = false
mainloop_convergence_atol = 1e-3       # stop when |Δ standardized sersic params| < atol
mainloop_convergence_patience = 2      # consecutive within-atol iters required to early-stop
mainloop_min_iter = 2                  # never early-stop before this many iters
use_dual_annealing = true              # iter-1 main-loop sersic fit: short iNM -> scipy.dual_annealing (escape false basins)
use_final_polish = true                # post-mainloop L-BFGS-B polish on the final sersic params
refit_sersic_after_psf_calib = true    # after a PSF recalibration, re-optimise the sersic params under the NEW psf instead of only re-rendering the old ones (best-fit n moves 17-100% across the plausible psf-width range)
final_sersic_polish_after_psf = true   # end the loop with a sersic polish AFTER the last PSF photometry pass, so the saved params are optimal for the saved psf_sub_data

[psf-calib]
in_mainloop = true                     # per-iter kernel recalibration (set false to disable)
kernel_family = 'gaussian'             # 'gaussian' | 'moffat' | 'drizzle'
kernel_anchor_K = 30                   # # of brightest anchors used in the kernel fit
kernel_fit_skip_on_convergence = false # if true, skip fwhm scan once kernel L2 stable
kernel_skip_threshold = 1e-3           # kernel RMS distance defining "stable" (used by the scan skip above AND the freeze gate below)
freeze_when_stable = true              # once the kernel is stable for freeze_patience consecutive iters, skip recalibration (incl. the anchor re-photometry) for the rest of the main loop
freeze_patience = 2                    # consecutive stable iterations required before freezing

kernel_fit_objective = 'multi_source'      # 'multi_source' (NNLS lstsq) | 'single_source' (legacy LM)
kernel_fit_stamp_half_min = 8              # min stamp half (px)
kernel_fit_stamp_half_in_sigma_library = 4.0 # stamp half = factor × the LIBRARY PSF sigma. Deliberately NOT sized from the calibrated/previous kernel width: that closed a feedback loop (wider estimate -> bigger stamp -> wider estimate) with no fixed point, which is what made wide filters (F160W/F277W) run wide and scatter galaxy-to-galaxy.
kernel_fit_bkg_order = 2                   # per-stamp background basis: 0=constant, 1=linear plane, 2=quadratic. A constant cannot represent the real smooth flux inside a stamp (galaxy disc, sky gradient, neighbour wings), so the fit absorbs it by broadening the PSF; 2 makes the recovered width stamp-size-independent.
kernel_fit_max_neighbors = 15              # max neighbour columns per stamp
kernel_fit_neighbor_pad_pix = 4.0          # neighbour search radius beyond stamp (px)
center_mask_r_in_galaxy_size = 1.5         # calibration centre mask radius (× cd.galaxy_size, the robust initial Gaussian σ-guess; NOT the Sersic r_eff, which can run away on small/crowded cutouts and saturate the cap); capped at 0.45×min(residual.shape); 0 disables
calib_xy_bounds = 3.0                       # calibration re-runs a dedicated anchor photometry with this position bound (px) so the kernel fit gets free-centroid, flag-32-free anchors; science psf_table (xy_bounds≈0) is untouched. Unset/None disables (reuse cd.psf_table).
calib_th = 5.0                              # threshold (× bkg_std) for the calibration anchor re-photometry. Decoupled from [psf].th_min so lowering the science detection floor (e.g. th_min=2 for deeper iPSF) doesn't flood the calibrator with noise spikes that fail quality cuts and starve it of anchors (small-FWHM filters like F277W are most sensitive — at th≤3 DAO finds noise spikes that all fail the per-source PSF-fit quality cuts, leaving 0 anchors → bootstrap σ saturates at the upper bound).

# fwhm scan inner photometry: 'lm' (default photutils PSFPhotometry) or 'nnls'
# (forced photometry at DAO positions, no SourceGrouper, no LM iters).
# When scan_method='nnls', `scan_metric` ranks bracket candidates by
#   'sum_snr'   = max Σ(flux/flux_err)
#   'resid_mad' = min residual MAD
#   'count'     = max # of NNLS sources passing flux_SNR cut (saturates with top_k)
# scan_top_k caps DAO detections to the brightest K (0 disables).
scan_method = 'lm'
scan_metric = 'sum_snr'
scan_top_k = 100

# fwhm_method: how to choose dao_fwhm_factor for the matched-filter detection.
#   'scan'      = run the bracket scan (uses scan_method/scan_metric/scan_top_k)
#   'empirical' = skip the scan; set factor = empirical_FWHM(cd.psf) / psf_sigma
#                 via photutils.psf.fit_fwhm (matched-filter theorem).
fwhm_method = 'empirical'

[psf]
th_min = 2
th_max = 30
th_iter = 10                           # threshold ladder steps
th_max_consec_empty = 3                # early-stop ladder after N empty passes
bkg_refit_per_iteration = true         # re-estimate bkg_std after each successful pass
bkg_floor_factor = 0.3                 # floor on re-estimated bkg_std (fraction of initial)
sparse_nnls = true                     # build the NNLS design matrix sparsely: each column is a render_shape stamp (~1% nonzero), so the Gram A.T@A costs ~1e4x fewer ops and ~100x less memory than the dense form. Same values.
fast_psf_interpolator = true           # evaluate ImagePSF via scipy.ndimage.map_coordinates instead of RectBivariateSpline: same cubic spline to ~1e-16, 3-7x faster per evaluation
ladder_dedup_psfsigma = 0.5            # in-ladder duplicate cut (× psf_sigma); 0 disables
ladder_warm_start = false              # after the first iPSF call, seed the joint refit with the previous catalogue and skip the detection ladder (the refit's leftover loop finds new sources). OFF by default: faster on sparse fields, SLOWER on crowded ones
ladder_full_every = 3                  # force a full ladder every Nth iPSF call to re-anchor the catalogue (0 = never after the first)

final_refit_method = 'iterative'       # 'iterative' | 'nnls' | 'none'

# 'iterative' refit
final_joint_refit = true
final_refit_xy_bounds = 0.0            # px; 0 pins positions
final_refit_fix_positions = true       # when pinned: genuinely fix x_0/y_0 (flux-only LM, no mega-group 3N-param Jacobians, no spurious flag 32) instead of xy_bounds=1e-6
final_refit_reuse_unchanged_groups = true # refit only groups whose member set changed since the previous refit iteration; splice the rest from cache (exact — groups are independent LM subproblems on a constant image)
final_refit_iterations = 5
final_refit_detect_th = 4.0            # leftover detect threshold (× residual MAD)
final_refit_dedup_psfsigma = 2.0
final_refit_residual_tol = 0.01        # stop when residual MAD stops improving
final_refit_catastrophic_flux_factor = 20.0
final_refit_fit_shape = [11, 11]       # joint-refit fit window (px)

# 'nnls' refit + post-NNLS find_peaks leftover loop
leftover_max_iterations = 3            # 0 disables the leftover loop
leftover_detect_k_sigma = 5.0
leftover_dedup_psfsigma = 1.5
leftover_box_size = 3

mask_aper_size_in_r_eff = 3.5          # sky-mask aperture size (× r_eff)
raise_error = false
residual_clip_sigma = 15.0             # high to avoid over-masking

finder_kwargs = {roundness_range=[-1.0, 1.0], sharpness_range=[0.20, 1.0]}
grouper_separation_in_psfsigma = 1.5   # smaller groups -> LM cost grows superlinearly with group size, so this is the main crowded-field speed knob (N5643/g002 -26%); validated neutral-or-better on residual quality
bkg_sigma_clip = 3.0
bkg_box_size = [10, 10]
bkg_filter_size = [5, 5]
localbkg_bounds_in_psfsigma = [2, 5]

center_mask_r_in_fwhm = 1.5            # iPSF centre mask radius (× empirical effective PSF FWHM); 0 disables

PSFPhotometry_aperture_radius = 3
PSFPhotometry_fitter_maxiters = 300
PSFPhotometry_fit_shape_in_fwhm = 1.5  # n = max(3, next_odd(2.355·psf_sigma·frac))
modelimg_render_shape = [25, 25]
PSFPhotometry_group_warning_threshold = 10

# Quality cuts
cuts_pos_err_max = 2                   # max fitted x/y err (px)
cuts_res_cen_sigma_clip = 3.0
cuts_cfit_sigma_clip = 3.0
cuts_chi2dof_median_factor = 3.0       # max_chi2dof / median(chi2dof)
cuts_pos_diff_median_factor = 2.0      # max_pos_diff / median(pos_diff)
cuts_flux_SNR_min = 1.0

[aperture]
petro = 0.5
center_mask = 4.0                      # aperture-photometry centre mask
plot = true
isophot_base_filter = 'F150W'
isophot_frac_min = 0.05
isophot_frac_max = 0.95
fit_isophot_to = 'sersic_modelimg'
measure_on = 'psf_sub_data'
error_on = 'psf_sub_data_error'
measure_sky_on = 'residual_masked'
fill_max_nan_frac = 0.7
fill_replace_with = 'median'           # alternative: 'sersic_modelimg'
PSF_corr_base_filter = 'F090W'
